<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Leonida // 3D Studio & Asset Pipeline</title>
  <meta http-equiv="refresh" content="0; url=viewer/index.html">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23ff2a85'><polygon points='12 2 2 7 12 12 22 7 12 2'/><polyline points='2 17 12 22 22 17'/><polyline points='2 12 12 17 22 12'/></svg>">
  <style>
    :root {
      --bg: #07070d;
      --accent-pink: #ff2a85;
      --accent-cyan: #00f0ff;
      --text-muted: #8e8ba8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: radial-gradient(circle at 20% 20%, rgba(255, 42, 133, 0.12) 0%, transparent 50%),
                  radial-gradient(circle at 80% 80%, rgba(0, 240, 255, 0.1) 0%, transparent 50%),
                  var(--bg);
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
      text-align: center;
    }
    .splash-card {
      background: rgba(16, 14, 28, 0.85);
      border: 1px solid rgba(255, 42, 133, 0.3);
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.7), 0 0 30px rgba(255, 42, 133, 0.2);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-radius: 16px;
      padding: 40px 32px;
      max-width: 480px;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      animation: fadeIn 0.4s ease-out;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .logo-box {
      width: 56px;
      height: 56px;
      background: linear-gradient(135deg, var(--accent-pink), var(--accent-cyan));
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 24px rgba(255, 42, 133, 0.6);
      margin-bottom: 20px;
    }
    .logo-box svg {
      width: 32px;
      height: 32px;
      stroke: #07070d;
      stroke-width: 2.2;
    }
    h1 {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: 1px;
      background: linear-gradient(90deg, #ffffff, #ffcee3);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 6px;
    }
    .subtitle {
      color: var(--accent-cyan);
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.5px;
      margin-bottom: 16px;
    }
    .desc {
      color: var(--text-muted);
      font-size: 13px;
      line-height: 1.5;
      margin-bottom: 24px;
    }
    .badges {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      justify-content: center;
      margin-bottom: 28px;
    }
    .badge {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 11px;
      color: #e0e0ff;
    }
    .enter-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: linear-gradient(135deg, var(--accent-pink), #cc1364);
      color: #fff;
      padding: 12px 28px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: 700;
      font-size: 14px;
      letter-spacing: 0.5px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      box-shadow: 0 0 20px rgba(255, 42, 133, 0.4);
      transition: all 0.2s ease;
    }
    .enter-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 0 28px rgba(255, 42, 133, 0.6);
    }
    .spinner {
      margin-top: 20px;
      width: 22px;
      height: 22px;
      border: 2px solid rgba(0, 240, 255, 0.2);
      border-top-color: var(--accent-cyan);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
  <script>
    // Instant seamless redirect to the full interactive 3D studio
    window.location.replace("viewer/index.html");
  </script>
</head>
<body>
  <div class="splash-card">
    <div class="logo-box">
      <svg viewBox="0 0 24 24" fill="none">
        <polygon points="12 2 2 7 12 12 22 7 12 2"></polygon>
        <polyline points="2 17 12 22 22 17"></polyline>
        <polyline points="2 12 12 17 22 12"></polyline>
      </svg>
    </div>
    <h1>LEONIDA // 3D STUDIO</h1>
    <div class="subtitle">Asset Inspector & WebGL Viewer</div>
    <p class="desc">Перенаправление в интерактивную 3D веб-студию...</p>
    <div class="badges">
      <span class="badge">glTF 2.0</span>
      <span class="badge">DirectStorage BCPack</span>
      <span class="badge">Three.js</span>
      <span class="badge">Vice City Lighting</span>
    </div>
    <a href="viewer/index.html" class="enter-btn">
      Войти в 3D Studio →
    </a>
    <div class="spinner"></div>
  </div>
</body>
</html>
