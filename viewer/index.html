<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Leonida // 3D Studio & Asset Inspector</title>
<link rel="stylesheet" href="style.css">
<script src="vendor/three.min.js"></script>
<script src="vendor/OrbitControls.js"></script>
<script src="vendor/GLTFLoader.js"></script>
</head>
<body>

<div id="loading-bar"></div>

<!-- Drop Overlay -->
<div id="drop-overlay">
  <div class="drop-box">
    <div class="drop-icon">⬡</div>
    <h2 id="lbl-drop-title">Импорт 3D модели</h2>
    <p id="lbl-drop-desc">Отпустите файл .GLB или .GLTF для мгновенного рендеринга</p>
  </div>
</div>

<header>
  <div class="brand">
    <div class="brand-logo">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polygon points="12 2 2 7 12 12 22 7 12 2"></polygon><polyline points="2 17 12 22 22 17"></polyline><polyline points="2 12 12 17 22 12"></polyline></svg>
    </div>
    <div class="brand-title">
      <h1>LEONIDA <span class="accent-text">// 3D STUDIO</span></h1>
      <p id="t-subtitle">\digital piece by ESLL</p>
    </div>
  </div>

  <div class="header-center">
    <div class="segmented-tabs">
      <button class="tab-btn active" id="tab-btn-models" onclick="switchTab('models')">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path></svg>
        <span id="lbl-tab-models">3D Модели</span> <span class="badge" id="badge-models">0</span>
      </button>
      <button class="tab-btn" id="tab-btn-textures" onclick="switchTab('textures')">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><polyline points="21 15 16 10 5 21"></polyline></svg>
        <span id="lbl-tab-textures">Текстуры</span> <span class="badge" id="badge-textures">0</span>
      </button>
    </div>
  </div>

  <div class="header-right">
    <div class="lang-switch">
      <button class="lang-btn active" id="lang-btn-ru" onclick="setLanguage('ru')">RU</button>
      <button class="lang-btn" id="lang-btn-eu" onclick="setLanguage('eu')">EN</button>
    </div>
    <a href="https://github.com/wxrrry/leonida-asset-pipeline" target="_blank" class="icon-link" title="GitHub Repository">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z"/></svg>
    </a>
  </div>
</header>

<main>
  <!-- 3D Models View -->
  <section id="models-view" class="view-panel active">
    <aside id="sidebar">
      <div class="sidebar-search">
        <div class="search-box">
          <svg class="search-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
          <input type="text" id="model-search" class="search-input" placeholder="Поиск по названию или категории..." oninput="onModelSearch()">
          <span class="search-kbd">/</span>
        </div>
        <div class="filter-chips" id="category-chips"></div>
      </div>
      <div id="model-list"></div>
    </aside>

    <div id="canvas-container">
      <canvas id="three-canvas"></canvas>

      <!-- Top Center Floating Shading Mode Dock -->
      <div class="dock-floating dock-shading" id="shading-dock">
        <div class="dock-segmented">
          <button class="dock-btn active" id="btn-shade-original" onclick="setShadingMode('original')" title="Оригинальные текстуры">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z"></path></svg>
            <span class="btn-lbl" id="lbl-shade-orig">Текстуры</span>
          </button>
          <button class="dock-btn" id="btn-shade-clay" onclick="setShadingMode('clay')" title="Студийная глина (Studio Clay)">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><path d="M8 12h8"></path></svg>
            <span class="btn-lbl" id="lbl-shade-clay">Clay</span>
          </button>
          <button class="dock-btn" id="btn-shade-normals" onclick="setShadingMode('normals')" title="Векторы нормалей">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="12 2 22 8.5 22 15.5 12 22 2 15.5 2 8.5 12 2"></polygon><line x1="12" y1="22" x2="12" y2="15.5"></line><polyline points="22 8.5 12 15.5 2 8.5"></polyline></svg>
            <span class="btn-lbl" id="lbl-shade-norm">Нормали</span>
          </button>
          <button class="dock-btn" id="btn-wireframe" onclick="toggleWireframe()" title="Каркасная сетка полигонов">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"></rect><line x1="3" y1="9" x2="21" y2="9"></line><line x1="3" y1="15" x2="21" y2="15"></line><line x1="9" y1="3" x2="9" y2="21"></line><line x1="15" y1="3" x2="15" y2="21"></line></svg>
            <span class="btn-lbl" id="lbl-shade-wire">Сетка</span>
          </button>
        </div>
      </div>

      <!-- Top Right Floating Studio & Lighting Controls -->
      <div class="dock-floating dock-actions" id="actions-dock">
        <div class="env-selector">
          <span class="env-label" id="lbl-light">Свет:</span>
          <div class="env-pills">
            <button class="env-pill active" id="btn-env-vice-city" title="Vice City Neon (Неон)" onclick="setEnvironment('vice-city')">
              <span class="env-dot dot-neon"></span>
              <span class="env-name">Neon</span>
            </button>
            <button class="env-pill" id="btn-env-miami-sunset" title="Miami Sunset (Закат)" onclick="setEnvironment('miami-sunset')">
              <span class="env-dot dot-sunset"></span>
              <span class="env-name">Sunset</span>
            </button>
            <button class="env-pill" id="btn-env-studio-neutral" title="Neutral Studio (Студия)" onclick="setEnvironment('studio-neutral')">
              <span class="env-dot dot-neutral"></span>
              <span class="env-name">Studio</span>
            </button>
            <button class="env-pill" id="btn-env-cyberpunk-amber" title="Cyberpunk Amber (Киберпанк)" onclick="setEnvironment('cyberpunk-amber')">
              <span class="env-dot dot-amber"></span>
              <span class="env-name">Amber</span>
            </button>
          </div>
        </div>

        <div class="action-buttons">
          <button class="action-btn btn-snap" id="btn-snapshot" onclick="exportSnapshot()" title="Экспорт 4K скриншота">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path><circle cx="12" cy="13" r="4"></circle></svg>
            <span id="lbl-snapshot">Снимок HD</span>
          </button>
          <button class="action-btn btn-open" id="btn-open-file" onclick="document.getElementById('local-file-input').click()" title="Импорт локального .GLB файла">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
            <span id="lbl-open-file">Открыть .GLB</span>
          </button>
          <input type="file" id="local-file-input" accept=".glb,.gltf" style="display: none;" onchange="onLocalFileChosen(event)">
        </div>
      </div>

      <!-- Bottom Right Quick Viewport Helpers Dock -->
      <div class="dock-floating dock-helpers" id="helpers-dock">
        <button class="helper-btn" id="btn-bbox" onclick="toggleBBox()" title="Габаритный контейнер (Bounding Box)">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path><polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline><line x1="12" y1="22.08" x2="12" y2="12"></line></svg>
          <span id="lbl-bbox">Габариты</span>
        </button>
        <button class="helper-btn" id="btn-autorotate" onclick="toggleAutoRotate()" title="Автоматическое вращение">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 4 23 10 17 10"></polyline><polyline points="1 20 1 14 7 14"></polyline><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path></svg>
          <span id="lbl-autorotate">Вращение</span>
        </button>
        <button class="helper-btn" id="btn-reset-cam" onclick="resetCamera()" title="Сбросить фокус камеры">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"></circle><path d="M3 12h3M18 12h3M12 3v3M12 18v3"></path></svg>
          <span id="lbl-reset-cam">Центрировать</span>
        </button>
      </div>

      <!-- Bottom Left Telemetry HUD Card -->
      <div id="stats-overlay" class="hud-card">
        <div class="hud-header">
          <div class="hud-status">
            <span class="status-pulse"></span>
            <span class="hud-tag">3D INSPECTOR</span>
          </div>
          <span class="hud-cat-chip" id="stat-category">—</span>
        </div>
        <div class="hud-title" id="stat-name">—</div>
        <div class="hud-grid">
          <div class="hud-cell">
            <div class="cell-label" id="lbl-stat-triangles">Полигонов</div>
            <div class="cell-value" id="stat-triangles">0</div>
          </div>
          <div class="hud-cell">
            <div class="cell-label" id="lbl-stat-vertices">Вершин</div>
            <div class="cell-value" id="stat-vertices">0</div>
          </div>
          <div class="hud-cell">
            <div class="cell-label" id="lbl-stat-dimensions">Габариты (Ш×В×Г)</div>
            <div class="cell-value" id="stat-dimensions">—</div>
          </div>
          <div class="hud-cell">
            <div class="cell-label" id="lbl-stat-size">Размер файла</div>
            <div class="cell-value" id="stat-size">—</div>
          </div>
        </div>
      </div>
    </div>
  </section>

  <!-- Textures Gallery View -->
  <section id="textures-view" class="view-panel">
    <div class="tex-controls">
      <div class="tex-heading-group">
        <div class="tex-badge-tag">// DIRECTSTORAGE BC/DDS</div>
        <h2 id="lbl-tex-heading">Галерея текстур (DDS & PNG)</h2>
        <span id="tex-count">Поиск текстур...</span>
      </div>
      <div class="tex-search-wrap">
        <svg class="search-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
        <input type="text" id="tex-search-input" class="search-input" placeholder="Фильтр текстур по имени..." oninput="onTextureSearch()">
      </div>
    </div>
    <div id="textures-grid"></div>
  </section>
</main>

<!-- Lightbox Modal -->
<div class="modal-overlay" id="tex-modal" onclick="closeModal(event)">
  <div class="modal-content" onclick="event.stopPropagation()">
    <div class="modal-header">
      <div class="modal-title-wrap">
        <span class="modal-dot"></span>
        <span id="modal-title">Просмотр текстуры</span>
      </div>
      <button class="modal-close-btn" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body">
      <img id="modal-img" src="" alt="Texture Preview">
    </div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
