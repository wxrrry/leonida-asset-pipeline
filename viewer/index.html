<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Leonida 3D Asset Studio</title>
<style>
  :root {
    --bg-dark: #0a0c10;
    --panel-bg: #12161f;
    --panel-border: #1f2633;
    --accent: #ffaa00;
    --accent-hover: #ffbb33;
    --text-main: #f0f3f6;
    --text-muted: #8b949e;
    --card-bg: #161b22;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg-dark);
    color: var(--text-main);
    display: flex;
    flex-direction: column;
    height: 100vh;
    overflow: hidden;
  }
  header {
    background: var(--panel-bg);
    border-bottom: 1px solid var(--panel-border);
    padding: 12px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    z-index: 10;
  }
  .title-group h1 { font-size: 16px; font-weight: 700; color: var(--accent); }
  .title-group p { font-size: 11px; color: var(--text-muted); }
  .tabs { display: flex; gap: 8px; }
  .tab-btn {
    background: transparent;
    border: 1px solid var(--panel-border);
    color: var(--text-muted);
    padding: 6px 14px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 13px;
    transition: all .2s;
  }
  .tab-btn.active {
    background: var(--accent);
    color: #000;
    font-weight: 600;
    border-color: var(--accent);
  }
  main { flex: 1; position: relative; overflow: hidden; display: flex; }
  .view-panel { width: 100%; height: 100%; display: none; }
  .view-panel.active { display: flex; }

  /* 3D Model Inspector Layout */
  #models-view { display: flex; width: 100%; height: 100%; }
  #sidebar {
    width: 320px;
    background: var(--panel-bg);
    border-right: 1px solid var(--panel-border);
    display: flex;
    flex-direction: column;
    height: 100%;
  }
  .search-box { padding: 12px; border-bottom: 1px solid var(--panel-border); }
  .search-box input {
    width: 100%;
    background: var(--bg-dark);
    border: 1px solid var(--panel-border);
    color: #fff;
    padding: 8px 10px;
    border-radius: 6px;
    font-size: 12px;
  }
  #model-list { flex: 1; overflow-y: auto; padding: 8px; }
  .model-item {
    padding: 8px 12px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 12px;
    margin-bottom: 4px;
    display: flex;
    flex-direction: column;
    gap: 3px;
    border: 1px solid transparent;
  }
  .model-item:hover { background: var(--card-bg); border-color: var(--panel-border); }
  .model-item.active { background: #1c2331; border-color: var(--accent); }
  .model-item .m-name { font-weight: 500; word-break: break-all; }
  .model-item .m-meta { font-size: 10px; color: var(--text-muted); display: flex; justify-content: space-between; }
  
  #canvas-container { flex: 1; position: relative; background: #08090d; }
  #three-canvas { width: 100%; height: 100%; display: block; }
  #toolbar {
    position: absolute;
    top: 14px;
    right: 14px;
    background: rgba(18, 22, 31, 0.85);
    backdrop-filter: blur(8px);
    border: 1px solid var(--panel-border);
    padding: 8px 12px;
    border-radius: 8px;
    display: flex;
    gap: 8px;
    align-items: center;
  }
  .tool-btn {
    background: #1c2331;
    border: 1px solid var(--panel-border);
    color: #fff;
    padding: 6px 10px;
    border-radius: 5px;
    font-size: 11px;
    cursor: pointer;
  }
  .tool-btn.active { background: var(--accent); color: #000; font-weight: 600; }
  #stats-overlay {
    position: absolute;
    bottom: 14px;
    left: 14px;
    background: rgba(18, 22, 31, 0.85);
    backdrop-filter: blur(8px);
    border: 1px solid var(--panel-border);
    padding: 10px 14px;
    border-radius: 8px;
    font-size: 11px;
    color: var(--text-muted);
    line-height: 1.5;
  }
  #stats-overlay b { color: #fff; }

  /* Textures Grid Layout */
  #textures-view { flex-direction: column; width: 100%; height: 100%; overflow-y: auto; padding: 20px; }
  .grid-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
  #textures-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
    gap: 16px;
  }
  .tex-card {
    background: var(--panel-bg);
    border: 1px solid var(--panel-border);
    border-radius: 8px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    transition: transform .15s;
  }
  .tex-card:hover { transform: translateY(-2px); border-color: var(--accent); }
  .tex-preview {
    height: 140px;
    background: #000;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  .tex-preview img { max-width: 100%; max-height: 100%; object-fit: contain; }
  .tex-info { padding: 10px; font-size: 11px; }
  .tex-name { font-weight: 600; margin-bottom: 4px; word-break: break-all; }
  .tex-size { color: var(--text-muted); }

  #loading-bar {
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
    background: var(--accent);
    transform: scaleX(0);
    transform-origin: left;
    transition: transform .2s;
  }
</style>
<script src="/vendor/three.min.js"></script>
<script src="/vendor/OrbitControls.js"></script>
<script src="/vendor/GLTFLoader.js"></script>
</head>
<body>

<div id="loading-bar"></div>

<header>
  <div class="title-group">
    <h1>Leonida 3D Studio & Asset Inspector</h1>
    <p>Local Clean-Room Asset Viewer</p>
  </div>
  <div class="tabs">
    <button class="tab-btn active" onclick="switchTab('models')">3D Модели</button>
    <button class="tab-btn" onclick="switchTab('textures')">Текстуры</button>
  </div>
</header>

<main>
  <!-- 3D Models Inspector -->
  <section id="models-view" class="view-panel active">
    <div id="sidebar">
      <div class="search-box">
        <input type="text" id="model-search" placeholder="Поиск моделей..." oninput="filterModels()">
      </div>
      <div id="model-list"></div>
    </div>
    <div id="canvas-container">
      <canvas id="three-canvas"></canvas>
      <div id="toolbar">
        <button class="tool-btn" id="btn-wireframe" onclick="toggleWireframe()">Сетка (Wireframe)</button>
        <button class="tool-btn" onclick="resetCamera()">Сброс камеры</button>
      </div>
      <div id="stats-overlay">
        <div>Модель: <b id="stat-name">—</b></div>
        <div>Полигонов (треугольников): <b id="stat-triangles">0</b></div>
        <div>Вершин: <b id="stat-vertices">0</b></div>
        <div>Размер файла: <b id="stat-size">—</b></div>
      </div>
    </div>
  </section>

  <!-- Textures Gallery -->
  <section id="textures-view" class="view-panel">
    <div class="grid-header">
      <h2 style="font-size: 15px;">Извлечённые текстуры (DirectDraw / PNG)</h2>
      <span id="tex-count" style="font-size: 12px; color: var(--text-muted);">0 текстур</span>
    </div>
    <div id="textures-grid"></div>
  </section>
</main>

<script>
let allModels = [];
let allTextures = [];
let scene, camera, renderer, controls;
let currentMesh = null;
let wireframeActive = false;

function formatBytes(bytes) {
  if (!bytes) return '0 B';
  const k = 1024, dm = 2;
  const sizes = ['B', 'KB', 'MB', 'GB'];
  const i = Math.floor(Math.log(bytes) / Math.log(k));
  return parseFloat((bytes / Math.pow(k, i)).toFixed(dm)) + ' ' + sizes[i];
}

function switchTab(tab) {
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.view-panel').forEach(p => p.classList.remove('active'));
  if (tab === 'models') {
    document.querySelector('.tab-btn:nth-child(1)').classList.add('active');
    document.getElementById('models-view').classList.add('active');
    onWindowResize();
  } else {
    document.querySelector('.tab-btn:nth-child(2)').classList.add('active');
    document.getElementById('textures-view').classList.add('active');
    if (allTextures.length === 0) loadTextures();
  }
}

function initThree() {
  const container = document.getElementById('canvas-container');
  const canvas = document.getElementById('three-canvas');
  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x0a0c10);

  camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);
  camera.position.set(0, 2, 5);

  renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true });
  renderer.setSize(container.clientWidth, container.clientHeight);
  renderer.setPixelRatio(window.devicePixelRatio);
  renderer.outputEncoding = THREE.sRGBEncoding;

  controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.dampingFactor = 0.05;

  const hemiLight = new THREE.HemisphereLight(0xffffff, 0x444444, 1.2);
  hemiLight.position.set(0, 20, 0);
  scene.add(hemiLight);

  const dirLight = new THREE.DirectionalLight(0xffffff, 1.5);
  dirLight.position.set(5, 10, 7);
  scene.add(dirLight);

  const grid = new THREE.GridHelper(10, 20, 0xffaa00, 0x1f2633);
  scene.add(grid);

  window.addEventListener('resize', onWindowResize);
  animate();
}

function onWindowResize() {
  const container = document.getElementById('canvas-container');
  if (!container || !renderer) return;
  camera.aspect = container.clientWidth / container.clientHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(container.clientWidth, container.clientHeight);
}

function animate() {
  requestAnimationFrame(animate);
  if (controls) controls.update();
  if (renderer && scene && camera) renderer.render(scene, camera);
}

function loadModel(url, name, size) {
  const bar = document.getElementById('loading-bar');
  bar.style.transform = 'scaleX(0.4)';
  
  const loader = new THREE.GLTFLoader();
  loader.load(url, (gltf) => {
    bar.style.transform = 'scaleX(1)';
    setTimeout(() => { bar.style.transform = 'scaleX(0)'; }, 300);

    if (currentMesh) scene.remove(currentMesh);
    currentMesh = gltf.scene;
    scene.add(currentMesh);

    let verts = 0;
    let tris = 0;
    currentMesh.traverse((child) => {
      if (child.isMesh) {
        if (child.geometry) {
          verts += child.geometry.attributes.position ? child.geometry.attributes.position.count : 0;
          tris += child.geometry.index ? child.geometry.index.count / 3 : (child.geometry.attributes.position ? child.geometry.attributes.position.count / 3 : 0);
        }
        if (wireframeActive && child.material) child.material.wireframe = true;
      }
    });

    document.getElementById('stat-name').innerText = name;
    document.getElementById('stat-triangles').innerText = Math.round(tris).toLocaleString();
    document.getElementById('stat-vertices').innerText = Math.round(verts).toLocaleString();
    document.getElementById('stat-size').innerText = formatBytes(size);

    // Auto-fit camera
    const box = new THREE.Box3().setFromObject(currentMesh);
    const center = box.getCenter(new THREE.Vector3());
    const sizeVec = box.getSize(new THREE.Vector3());
    const maxDim = Math.max(sizeVec.x, sizeVec.y, sizeVec.z);
    
    currentMesh.position.sub(center);
    camera.position.set(maxDim * 1.5, maxDim * 1.2, maxDim * 1.8);
    controls.target.set(0, 0, 0);
  }, undefined, (err) => {
    bar.style.transform = 'scaleX(0)';
    alert('Не удалось загрузить 3D модель: ' + name);
  });
}

function toggleWireframe() {
  wireframeActive = !wireframeActive;
  document.getElementById('btn-wireframe').classList.toggle('active', wireframeActive);
  if (currentMesh) {
    currentMesh.traverse((child) => {
      if (child.isMesh && child.material) {
        child.material.wireframe = wireframeActive;
      }
    });
  }
}

function resetCamera() {
  if (controls) {
    controls.reset();
  }
}

async function loadModels() {
  try {
    const res = await fetch('/api/models');
    const data = await res.json();
    allModels = data.models || [];
    renderModelList(allModels);
    if (allModels.length > 0) {
      loadModel(allModels[0].url, allModels[0].name, allModels[0].size);
    }
  } catch (e) {
    console.error(e);
  }
}

function renderModelList(models) {
  const container = document.getElementById('model-list');
  container.innerHTML = '';
  if (models.length === 0) {
    container.innerHTML = '<div style="padding: 12px; color: var(--text-muted); font-size: 12px;">Модели (.glb) не найдены. Сконвертируйте их через batch_glb.py</div>';
    return;
  }
  models.forEach((m, idx) => {
    const div = document.createElement('div');
    div.className = 'model-item' + (idx === 0 ? ' active' : '');
    div.innerHTML = `
      <div class="m-name">${m.name}</div>
      <div class="m-meta">
        <span>${m.category}</span>
        <span>${formatBytes(m.size)}</span>
      </div>
    `;
    div.onclick = () => {
      document.querySelectorAll('.model-item').forEach(el => el.classList.remove('active'));
      div.classList.add('active');
      loadModel(m.url, m.name, m.size);
    };
    container.appendChild(div);
  });
}

function filterModels() {
  const q = document.getElementById('model-search').value.toLowerCase();
  const filtered = allModels.filter(m => m.name.toLowerCase().includes(q) || m.category.toLowerCase().includes(q));
  renderModelList(filtered);
}

async function loadTextures() {
  try {
    const res = await fetch('/api/textures');
    const data = await res.json();
    allTextures = data.textures || [];
    document.getElementById('tex-count').innerText = `${allTextures.length} текстур`;
    const grid = document.getElementById('textures-grid');
    grid.innerHTML = '';
    allTextures.forEach(t => {
      const card = document.createElement('div');
      card.className = 'tex-card';
      card.innerHTML = `
        <div class="tex-preview">
          <img src="${t.preview}" alt="${t.name}" loading="lazy" onerror="this.style.display='none'">
        </div>
        <div class="tex-info">
          <div class="tex-name" title="${t.name}">${t.name}</div>
          <div class="tex-size">${formatBytes(t.size)} · ${t.format}</div>
        </div>
      `;
      grid.appendChild(card);
    });
  } catch (e) {
    console.error(e);
  }
}

window.onload = () => {
  initThree();
  loadModels();
};
</script>
</body>
</html>
